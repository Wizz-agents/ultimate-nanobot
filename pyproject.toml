[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-nanobot"
version = "0.1.0"
description = "Tiny, dependency-free framework for single-purpose autonomous workers (nanobots) with guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ADZ" }]
keywords = ["automation", "agents", "workers", "cron", "safety", "llm", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nanobot = "ultimate_nanobot.cli:main"

[tool.setuptools.packages.find]
include = ["ultimate_nanobot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
